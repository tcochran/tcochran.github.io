# Site settings
title: Tim Cochran
tagline: Software engineering and developer experience
description: >-
  Tim Cochran's blog on software engineering and developer experience
url: "https://timcochran.io"
baseurl: ""

lang: en
timezone: America/New_York

# Theme
theme: jekyll-theme-chirpy
theme_mode: # blank = auto (light/dark based on OS preference + manual toggle)

# Social
social:
  name: Tim Cochran
  email: timothy.cochran@gmail.com
  links:
    - https://github.com/tcochran
    - https://twitter.com/timcochran

github:
  username: tcochran

twitter:
  username: timcochran

# Pagination
paginate: 10

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Collections
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Chirpy-specific
avatar: # optional: path to avatar image
toc: true

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
