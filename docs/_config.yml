# Site settings
title: Maximizing Developer Effectiveness
tagline: Agentic and Developer Experience
description: >-
  Tim Cochran's blog on agentic and developer experience
url: "https://timcochran.io"
baseurl: ""

lang: en
timezone: America/New_York

# Theme
theme: jekyll-theme-chirpy
theme_mode: light

# Social
social:
  name: Tim Cochran
  links:
    - https://www.linkedin.com/in/timcochran

# Pagination
paginate: 10

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Collections
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Chirpy-specific
toc: true

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
